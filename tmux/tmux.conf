# Use 1-based indexing for windows and panes
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically when one is closed
set -g renumber-windows on

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Split panes using intuitive keys
bind | split-window -h
bind - split-window -v

# Reload config. The path was ~/.tmux.conf, which does not exist -- this file
# lives in ~/.config/tmux, so every reload silently did nothing.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Better terminal colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse support
set -g mouse on

# Programs that asked for the mouse get the wheel; a plain shell enters copy mode.
#
# Claude Code (tui = "fullscreen") is one of the programs that asks: it scrolls
# its own transcript with the wheel, which is how a response longer than the
# pane is meant to be read. Do not special-case it away from 'send -M'.
#
# NOTE: #{||:} takes exactly TWO arguments in tmux 3.2. A third one is
# swallowed into the second as the string "0,0", which is truthy -- so the
# earlier three-argument form was always true and every pane, plain shells
# included, got 'send -M'. Measured: `tmux display -p '#{||:0,0,0}'` -> 1.
bind -n WheelUpPane \
  if -F '#{||:#{alternate_on},#{||:#{pane_in_mode},#{mouse_any_flag}}}' \
    'send -M' 'copy-mode -e'

# Faster escape timing for Vim/Neovim
set -sg escape-time 10

# Scrollback. The default is 2000 lines, which a single long command can blow
# through.
set -g history-limit 100000

# alternate-screen is left at its default (on). It was turned off on Sep 18 so
# that claude's output would land in tmux history, measured against the classic
# renderer. With tui = "fullscreen" (settings.json) claude lives on the
# alternate screen like nvim and scrolls its own transcript with the wheel;
# suppressing that screen made its repaints wipe the pane history instead
# (measured: 36 -> 15 lines with no resize). For tmux copy mode or search,
# Ctrl-o then [ writes the whole conversation into the scrollback.

# Navigate copy mode with vim keys: prefix-[ to enter, v to select, y to yank,
# q to leave. Without this it is emacs bindings.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-u send -X halfpage-up
bind -T copy-mode-vi C-d send -X halfpage-down

# prefix-P: dump this pane's entire scrollback to a file and open it in nvim.
# The escape hatch for output too long to read in place -- and the one thing
# that also works for a pane that is currently on the alternate screen, because
# it captures what tmux has rather than what is on screen.
bind P command-prompt -p "save pane to:" -I "/tmp/tmux-pane.txt" \
  "capture-pane -S - -E - -p > %1 ; new-window 'nvim %1'"

# prefix-C: open this session's Claude transcript in nvim.
#
# Claude Code repaints its viewport rather than streaming lines, so its output
# never reaches the scrollback below -- measured: a 200-line answer added 0
# lines of history. The conversation is on disk as JSONL either way, and
# claude-log renders it back to Markdown.
bind C new-window -c "#{pane_current_path}" "claude-log"

# prefix-M: toggle this pane between its normal size and full-window zoom.
bind M resize-pane -Z

#tmux-powerline. Package from nixpkgs, linked to a stable path by home.nix
# Must be last entry of tmux.conf!
run-shell ~/.config/tmux/plugins/powerline/main.tmux

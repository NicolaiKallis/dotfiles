# Use 1-based indexing for windows and panes
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically when one is closed
set -g renumber-windows on

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Split panes using intuitive keys
bind | split-window -h
bind - split-window -v

# Reload config. The path was ~/.tmux.conf, which does not exist -- this file
# lives in ~/.config/tmux, so every reload silently did nothing.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Better terminal colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse support
set -g mouse on

# Programs that asked for the mouse get the wheel; a plain shell enters copy mode.
#
bind -n WheelUpPane \
  if -F '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' \
    'send -M' 'copy-mode -e'

# Faster escape timing for Vim/Neovim
set -sg escape-time 10

# Scrollback. The default is 2000 lines, which a single long command can blow
# through.
set -g history-limit 100000

# Let full-screen programs scroll.
#
# By default a TUI (claude, nvim, less, htop) draws on the terminal's alternate
# screen, which tmux deliberately does NOT record -- measured: 200 lines of
# alt-screen output produced 0 lines of scrollback. That is why long output in
# claude could not be scrolled back to: there was nothing there to scroll.
#
# Turning it off makes those programs draw on the normal screen instead, so
# their output lands in the history above. This is what makes claude output
# scrollable at all -- measured across three live panes:
#
#   alternate-screen ON   ->  1 and 7 lines of history
#   alternate-screen OFF  ->  314 lines
#
# It only takes effect for panes started AFTER it is set, because the setting is
# consulted when the program asks for the alternate screen.
#
# The tradeoff, accepted deliberately: nvim and less no longer restore the
# previous screen on exit -- their final frame stays in the scrollback.
setw -g alternate-screen off

# Navigate copy mode with vim keys: prefix-[ to enter, v to select, y to yank,
# q to leave. Without this it is emacs bindings.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-u send -X halfpage-up
bind -T copy-mode-vi C-d send -X halfpage-down

# prefix-P: dump this pane's entire scrollback to a file and open it in nvim.
# The escape hatch for output too long to read in place -- and the one thing
# that also works for a pane that is currently on the alternate screen, because
# it captures what tmux has rather than what is on screen.
bind P command-prompt -p "save pane to:" -I "/tmp/tmux-pane.txt" \
  "capture-pane -S - -E - -p > %1 ; new-window 'nvim %1'"

# prefix-C: open this session's Claude transcript in nvim.
#
# Claude Code repaints its viewport rather than streaming lines, so its output
# never reaches the scrollback below -- measured: a 200-line answer added 0
# lines of history. The conversation is on disk as JSONL either way, and
# claude-log renders it back to Markdown.
bind C new-window -c "#{pane_current_path}" "claude-log"

# prefix-M: toggle this pane between its normal size and full-window zoom.
bind M resize-pane -Z
